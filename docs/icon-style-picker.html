<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分类图标风格选型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f6f9; color: #1f2430; padding: 32px 24px 80px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 750; }
  .sub { margin-top: 8px; color: #697080; font-size: 14px; line-height: 1.7; }
  .styles { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card {
    background: #fff; border: 2px solid #e5e9f0; border-radius: 16px; padding: 20px;
    cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover { border-color: #b9c8f5; box-shadow: 0 8px 24px rgba(49,89,215,.10); transform: translateY(-2px); }
  .card.selected { border-color: #3159d7; box-shadow: 0 8px 24px rgba(49,89,215,.18); }
  .card.selected .pick { background: #3159d7; color: #fff; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .name { font-size: 17px; font-weight: 750; }
  .tag { font-size: 11px; color: #8a92a1; }
  .pick {
    margin-left: 10px; padding: 4px 12px; border-radius: 999px; background: #eef1f6;
    color: #697080; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .desc { margin-top: 6px; color: #697080; font-size: 13px; line-height: 1.6; min-height: 42px; }
  .grid { margin-top: 14px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .icon svg { width: 26px; height: 26px; }
  .cell .label { font-size: 11px; color: #697080; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result {
    margin-top: 28px; padding: 18px 22px; border-radius: 14px; background: #fff;
    border: 2px dashed #cfd6e2; font-size: 15px; color: #414855; line-height: 1.7;
  }
  .result b { color: #3159d7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>分类图标 · 风格选型</h1>
  <p class="sub">下面是同一套 15 个分类在 5 种风格下的实际效果（小程序与 Web 会保持一致）。<br>点击卡片选中你喜欢的风格，选完把卡片右上角的代号告诉我即可，例如「选 C」。</p>

  <div class="styles" id="styles"></div>

  <div class="result" id="result">👆 点击上方任意卡片进行选择</div>
</div>

<script>
// SVG path 数据 —— 与仓库 shared/category-icons.ts 完全一致
var PATHS = {
  food: "M4 11 h16 a8 5 0 0 1 -16 0 Z M8 4 v8 M16 4 v8",
  transport: "M4 14 h16 v3 h-3 a1.5 1.5 0 0 1 -3 0 h-4 a1.5 1.5 0 0 1 -3 0 h-3 z M7 14 v-3 a3 3 0 0 1 3 -3 h4 a3 3 0 0 1 3 3 v3",
  shopping: "M5 8 h14 l-1.5 11 a2 2 0 0 1 -2 1.5 h-7 a2 2 0 0 1 -2 -1.5 z M9 8 v-2 a3 3 0 0 1 6 0 v2",
  home: "M3 12 l9 -8 9 8 v9 h-6 v-6 h-6 v6 h-6 z",
  utility: "M9 18 h6 M10 21 h4 M12 3 a6 6 0 0 0 -4 10.5 h8 a6 6 0 0 0 -4 -10.5 z",
  entertainment: "M3 9 a2 2 0 0 1 2 -2 h14 a2 2 0 0 1 2 2 v6 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 z M8 12 h-2 M9 10 v4 M16 12 h-2 M15 10 v4",
  health: "M9 3 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 v-6 h6 z",
  education: "M3 5 l9 -3 9 3 v12 l-9 4 -9 -4 z M3 5 v12 M12 2 v14",
  clothing: "M4 7 l5 -4 h6 l5 4 -3 3 v10 h-10 v-10 z",
  salary: "M12 3 a9 9 0 1 0 0 18 a9 9 0 1 0 0 -18 z M9 9 h6 M9 12 h6 M9 15 h6",
  invest: "M3 17 l6 -7 l4 4 l8 -10 M14 4 h7 v7",
  gift: "M3 9 h18 v3 h-18 z M4 12 v9 h16 v-9 M12 9 v12 M8 5 a2 2 0 0 1 4 2 a2 2 0 0 1 4 -2",
  pet: "M5 11 a3 3 0 0 1 3 -3 l1 2 2 -3 a3 3 0 0 1 4 0 l2 3 1 -2 a3 3 0 0 1 3 3 v3 a3 3 0 0 1 -3 3 h-10 a3 3 0 0 1 -3 -3 z",
  repay: "M3 7 h18 v12 h-18 z M3 11 h18 M7 15 h3",
  other: "M12 4 l8 16 h-16 z"
};
var NAMES = {
  food: "餐饮", transport: "交通", shopping: "购物", home: "住房", utility: "水电",
  entertainment: "娱乐", health: "医疗", education: "教育", clothing: "服饰",
  salary: "工资", invest: "理财", gift: "人情", pet: "宠物", repay: "还款", other: "其他"
};
var EMOJI = {
  food: "🍜", transport: "🚗", shopping: "🛒", home: "🏠", utility: "💡",
  entertainment: "🎮", health: "💊", education: "📚", clothing: "👕",
  salary: "💰", invest: "📈", gift: "🎁", pet: "🐾", repay: "💳", other: "🏷️"
};
// 每个分类的品牌色（彩色风格用）
var COLORS = {
  food: "#F97316", transport: "#3B82F6", shopping: "#EC4899", home: "#10B981",
  utility: "#D9A404", entertainment: "#8B5CF6", health: "#EF4444", education: "#6366F1",
  clothing: "#14B8A6", salary: "#22C55E", invest: "#F59E0B", gift: "#F43F5E",
  pet: "#A16207", repay: "#64748B", other: "#94A3B8"
};
function hexA(hex, a) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

var STYLES = [
  {
    id: "A", name: "浅底灰线（当前线上效果）",
    desc: "浅灰底 + 中性灰描边，最克制。目前小程序里就是这个，你觉得丑的是它。",
    render: function (key) {
      return '<div class="icon" style="background:#f1f3f7">' + svg(key, "#596273", 2) + "</div>";
    }
  },
  {
    id: "B", name: "彩色浅底（双色）",
    desc: "每个分类有专属色：浅色底 + 同色深图标。有辨识度又不吵，主流记账 App 常用风格。",
    render: function (key) {
      var c = COLORS[key];
      return '<div class="icon" style="background:' + hexA(c, .14) + '">' + svg(key, c, 2) + "</div>";
    }
  },
  {
    id: "C", name: "彩色实底（白图标）",
    desc: "每个分类实色圆角块 + 白色图标，视觉最重、最活泼，像 iOS 设置页。",
    render: function (key) {
      var c = COLORS[key];
      return '<div class="icon" style="background:' + c + '">' + svg(key, "#ffffff", 2) + "</div>";
    }
  },
  {
    id: "D", name: "Emoji 表情",
    desc: "系统原生 emoji，零设计成本、最有亲和力；缺点是各设备长相略有差异、颜色不可控。",
    render: function (key) {
      return '<div class="icon" style="background:#f1f3f7;font-size:24px">' + EMOJI[key] + "</div>";
    }
  },
  {
    id: "E", name: "极简无底（细线）",
    desc: "不要底色，细描边直接放，最轻最性冷淡。适合配浅色主题。",
    render: function (key) {
      return '<div class="icon">' + svg(key, "#6b7280", 1.5) + "</div>";
    }
  }
];

function svg(key, stroke, width) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + stroke +
    '" stroke-width="' + width + '" stroke-linecap="round" stroke-linejoin="round"><path d="' + PATHS[key] + '"/></svg>';
}

var wrap = document.getElementById("styles");
STYLES.forEach(function (s) {
  var cells = Object.keys(PATHS).map(function (key) {
    return '<div class="cell">' + s.render(key) + '<span class="label">' + NAMES[key] + "</span></div>";
  }).join("");
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="head"><span class="name">' + s.name + '</span><span class="pick">选 ' + s.id + "</span></div>" +
    '<div class="desc">' + s.desc + "</div>" +
    '<div class="grid">' + cells + "</div>";
  card.onclick = function () {
    document.querySelectorAll(".card").forEach(function (c) { c.classList.remove("selected"); });
    card.classList.add("selected");
    document.getElementById("result").innerHTML =
      '✅ 你选了 <b>风格 ' + s.id + " · " + s.name + "</b>。<br>回复我「选 " + s.id + "」，我会把小程序和 Web 两端的图标统一改成这个风格（约涉及一处配色定义 + 重新生成小程序 SVG 资源，改完你在开发者工具里重新编译即可看到）。";
  };
  wrap.appendChild(card);
});
</script>
</body>
</html>
