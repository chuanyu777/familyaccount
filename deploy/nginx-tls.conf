# TLS 终止层（反代）
#
# 公网唯一入口：443 提供 HTTPS，80 只做 301 跳转到 https。
# web / app / agent / mysql 都留在内部网络，不直接暴露。
#
# 证书挂载在 /etc/nginx/certs/（只读），由 compose 的 tls 服务映射。
# 注意：绑定域名 theseven.cc / www.theseven.cc（证书 SAN 覆盖这两者）。

server {
    listen 80;
    listen [::]:80;
    server_name theseven.cc www.theseven.cc;

    # 80 不承载业务，只跳转，避免有人用 http 绕过 HTTPS（Secure cookie 也不会被发送）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name theseven.cc www.theseven.cc;

    ssl_certificate     /etc/nginx/certs/theseven.cc_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/theseven.cc.key;

    # 微信小程序要求服务端至少支持 TLS 1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;

    # 家庭账本请求体很小；顺带给未来的头像上传留一点余量
    client_max_body_size 8m;

    # Docker 内置 DNS。配合下面的变量写法，让 upstream 在「请求时」解析而不是启动时，
    # 否则 tls 容器若先于 web 启动，nginx 会因为解析不到 web 而起不来。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $web_upstream web:80;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 让后端知道外部是 HTTPS（当前认证不依赖它，但语义要正确）
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # 稳定运行一段时间后可以再打开 HSTS（一旦开启，浏览器在 max-age 内不再接受 http）
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
