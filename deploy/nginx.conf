# 家庭记账簿 Nginx 配置
# - 托管 /platform 和 /ledger 单页应用入口及其子路径，刷新时回退到 index.html
# - /api/* 反代到后端 app 容器（compose 内部服务名 app:3001）
# - 仅监听内部 HTTP；公网 TLS 和 HTTP 到 HTTPS 跳转由外部网关负责

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（带 hash 的文件长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 这里的 $scheme 是容器收到的 HTTP，不代表外部网关的 HTTPS。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 健康检查：必须显式反代，否则会被下面的 SPA 回退吞掉返回首页 HTML
    location = /healthz {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        access_log off;
    }

    # /platform、/platform/*、/ledger、/ledger/* 直接访问或刷新都返回同一入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
