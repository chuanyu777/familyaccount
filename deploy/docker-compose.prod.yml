# 家庭记账簿生产部署（单台云服务器，Docker Compose）
#
# 五个服务：
#   tls   —— Nginx 反代：终止 TLS，对外唯一入口（443 提供 HTTPS，80 只做 301 跳转）
#   web   —— Nginx：托管前端静态文件 + 反代 /api 到后端（仅内部网络）
#   app   —— Spring Boot 后端（仅内部网络）
#   agent —— LangChain 助手运行时（仅内部网络）
#   mysql —— MySQL 8（数据持久化到卷）
#
# 启动（服务器上是 docker-compose v1，命令用 docker-compose）：
#   docker-compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d
#
# 访问：https://theseven.cc/platform（平台管理员，只读）
#       https://theseven.cc/ledger （账本 Web 用户）
# 证书：deploy/certs/（已加入 .gitignore；私钥需 chmod 600），绑定 theseven.cc
#
# 小服务器（2C4G）注意事项：
#   - 不要在服务器上构建镜像：vite 构建峰值 1~2GB、Maven 编译 1GB+，极易 OOM。
#     请在本地或 CI 构建后推送镜像仓库，或本地 docker save 后搬运；服务器只 pull + up。
#   - 各服务已配 mem_limit 与日志上限（合计约 2.0GB，给系统留出余量）。
#   - app 的 JVM 堆固定 512m，避免按宿主机 4GB 估算默认堆。
#   - 建议宿主机加 2~4GB swap 兜底，否则内存吃紧时 OOM killer 会先杀掉 mysql。

services:
  mysql:
    image: mysql:8.0
    container_name: family-ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置数据库密码}
      MYSQL_DATABASE: family_ledger
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:?请在 .env 中设置数据库密码}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # 显式声明镜像名：本地用 build 构建，服务器直接复用 docker load 进来的同名镜像，
    # 避免 compose 在服务器上因找不到 ../backend 源码而尝试构建并报错。
    image: deploy-app
    build:
      context: ../backend
    container_name: family-ledger-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: family_ledger
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置数据库密码}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置会话签名密钥}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?请在 .env 中设置 SESSION_COOKIE_SECURE=true}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:?请在 .env 中设置小程序 AppID}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:?请在 .env 中设置小程序 AppSecret}
      SPECIAL_LEDGER_NAME: ${SPECIAL_LEDGER_NAME:?请在 .env 中设置特殊账本名称}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:?请在 .env 中设置平台管理员用户名}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?请在 .env 中设置平台管理员密码}
      SPECIAL_LEDGER_OWNER_DISPLAY_NAME: ${SPECIAL_LEDGER_OWNER_DISPLAY_NAME:-本人}
      SPECIAL_LEDGER_OWNER_USERNAME: ${SPECIAL_LEDGER_OWNER_USERNAME:?请在 .env 中设置特殊账本 Web 用户名}
      SPECIAL_LEDGER_OWNER_PASSWORD: ${SPECIAL_LEDGER_OWNER_PASSWORD:?请在 .env 中设置特殊账本 Web 密码}
      SPECIAL_LEDGER_MEMBER_DISPLAY_NAME: ${SPECIAL_LEDGER_MEMBER_DISPLAY_NAME:-配偶}
      SPECIAL_LEDGER_MEMBER_USERNAME: ${SPECIAL_LEDGER_MEMBER_USERNAME:?请在 .env 中设置配偶 Web 用户名}
      SPECIAL_LEDGER_MEMBER_PASSWORD: ${SPECIAL_LEDGER_MEMBER_PASSWORD:?请在 .env 中设置配偶 Web 密码}
      ASSISTANT_AGENT_URL: ${ASSISTANT_AGENT_URL:-http://agent:8090}
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:?请在 .env 中设置助手内部令牌}
      # 时区必须是东八区：Time.today() / Time.now() / MonthUtil 用的是 JVM 默认时区，
      # 若为 UTC，北京时间 00:00–08:00 会把「今天」算成前一天，记账日期与月度统计都会错位。
      TZ: Asia/Shanghai
      # 再显式指定一次作为双保险，同时固定 JVM 堆上限。
      # 注意不要动 locale（现为 en_US），改成 zh_CN 可能影响金额格式化。
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 不对外暴露 3001，仅由 web 容器反代访问，更安全

  agent:
    image: deploy-agent
    build:
      context: ../agent
    container_name: family-ledger-agent
    restart: unless-stopped
    environment:
      # 容器内直接用服务名访问后端，不必绕 host.docker.internal
      SPRING_BASE_URL: http://app:3001
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中设置 DeepSeek API Key}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:?请在 .env 中设置助手内部令牌}
    depends_on:
      - app
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 不对外暴露 8090，仅由 app 容器在内部网络访问

  web:
    image: deploy-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: family-ledger-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - app
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 不再对外暴露端口，只由 tls 反代在内部网络访问

  # TLS 终止层，也是公网唯一入口：
  #   443 提供 HTTPS 并反代到 web；80 只做 301 跳转，避免有人用 http 绕过 HTTPS。
  tls:
    image: nginx:1.27-alpine
    container_name: family-ledger-tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
