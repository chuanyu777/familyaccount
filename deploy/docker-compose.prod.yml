# 家庭记账簿生产部署（单台云服务器，Docker Compose）
#
# 三个服务：
#   web   —— Nginx：托管前端静态文件 + 反代 /api 到后端（对外 80）
#   app   —— Spring Boot 后端（不对外暴露端口，仅内网）
#   mysql —— MySQL 8（数据持久化到卷）
#
# 使用：docker compose -f deploy/docker-compose.prod.yml up -d --build
# 首次会构建前端与后端镜像（依赖走阿里云/淘宝镜像源，视网络约几分钟）。

services:
  mysql:
    image: mysql:8.0
    container_name: family-ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      MYSQL_DATABASE: family_ledger
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../backend
    container_name: family-ledger-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: family_ledger
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      # 家庭访问口令：prod profile 下缺任一变量，进程会拒绝启动。
      # 默认 prod；若源站是纯 HTTP（未做 HTTPS），可在 .env 里设 SPRING_PROFILES_ACTIVE= 关掉，
      # 门禁依然生效（配了口令就启用），只是不做生产 fail-fast 校验。详见 deploy/README.md 第八节。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      FAMILY_ACCESS_CODE: ${FAMILY_ACCESS_CODE:?请在 .env 中设置家庭访问口令}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置会话签名密钥}
      # 位于单层 Nginx 之后，信任 1 跳转发头，否则限流会把所有请求算成同一地址
      TRUST_PROXY_HOPS: "1"
    depends_on:
      mysql:
        condition: service_healthy
    # 不对外暴露 3001，仅由 web 容器反代访问，更安全

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: family-ledger-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  mysql-data:
