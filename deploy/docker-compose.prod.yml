# 家庭记账簿生产部署（单台云服务器，Docker Compose）
#
# 三个服务：
#   web   —— Nginx：托管前端静态文件 + 反代 /api 到后端（对外 80）
#   app   —— Spring Boot 后端（不对外暴露端口，仅内网）
#   mysql —— MySQL 8（数据持久化到卷）
#
# 使用：docker compose -f deploy/docker-compose.prod.yml up -d --build
# 首次会构建前端与后端镜像（依赖走阿里云/淘宝镜像源，视网络约几分钟）。

services:
  mysql:
    image: mysql:8.0
    container_name: family-ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置数据库密码}
      MYSQL_DATABASE: family_ledger
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:?请在 .env 中设置数据库密码}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ../backend
    container_name: family-ledger-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: family_ledger
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置数据库密码}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置会话签名密钥}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?请在 .env 中设置 SESSION_COOKIE_SECURE=true}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:?请在 .env 中设置小程序 AppID}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:?请在 .env 中设置小程序 AppSecret}
      SPECIAL_LEDGER_NAME: ${SPECIAL_LEDGER_NAME:?请在 .env 中设置特殊账本名称}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:?请在 .env 中设置平台管理员用户名}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?请在 .env 中设置平台管理员密码}
      SPECIAL_LEDGER_OWNER_DISPLAY_NAME: ${SPECIAL_LEDGER_OWNER_DISPLAY_NAME:-本人}
      SPECIAL_LEDGER_OWNER_USERNAME: ${SPECIAL_LEDGER_OWNER_USERNAME:?请在 .env 中设置特殊账本 Web 用户名}
      SPECIAL_LEDGER_OWNER_PASSWORD: ${SPECIAL_LEDGER_OWNER_PASSWORD:?请在 .env 中设置特殊账本 Web 密码}
      SPECIAL_LEDGER_MEMBER_DISPLAY_NAME: ${SPECIAL_LEDGER_MEMBER_DISPLAY_NAME:-配偶}
      SPECIAL_LEDGER_MEMBER_USERNAME: ${SPECIAL_LEDGER_MEMBER_USERNAME:?请在 .env 中设置配偶 Web 用户名}
      SPECIAL_LEDGER_MEMBER_PASSWORD: ${SPECIAL_LEDGER_MEMBER_PASSWORD:?请在 .env 中设置配偶 Web 密码}
    depends_on:
      mysql:
        condition: service_healthy
    # 不对外暴露 3001，仅由 web 容器反代访问，更安全

  web:
    # 当前分支只交付后端 foundation；旧 Vue SPA 仍使用已废弃的单家庭 API。
    # Web/平台客户端完成后再移除该 profile，接入新客户端镜像。
    profiles: ["legacy-web"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: family-ledger-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  mysql-data:
