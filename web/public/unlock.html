<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>解锁家庭财务</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #131722; background: #f4f6f9; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { width: min(360px, calc(100% - 32px)); }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #697080; }
      label { display: grid; gap: 8px; font-weight: 600; }
      input, button { box-sizing: border-box; width: 100%; min-height: 44px; border-radius: 6px; font: inherit; }
      input { border: 1px solid #dce1e9; padding: 0 12px; background: #ffffff; }
      button { margin-top: 20px; border: 0; background: #3159d7; color: #ffffff; font-weight: 600; cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.7; }
      [role="alert"] { min-height: 24px; margin-top: 12px; color: #b84543; }
    </style>
  </head>
  <body>
    <main>
      <h1>解锁家庭财务</h1>
      <p>请输入家庭访问口令以继续。</p>
      <form id="unlock-form">
        <label>
          家庭访问口令
          <input id="code" name="code" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button type="submit">解锁</button>
        <div id="error" role="alert" aria-live="polite"></div>
      </form>
    </main>
    <script>
      const form = document.querySelector('#unlock-form');
      const code = document.querySelector('#code');
      const error = document.querySelector('#error');
      const button = form.querySelector('button');
      const next = new URLSearchParams(window.location.search).get('next');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;

        try {
          const response = await fetch('/api/access/unlock', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code.value }),
          });
          if (response.status === 204) {
            window.location.replace(next || '/');
            return;
          }
          error.textContent = response.status === 429
            ? '尝试次数过多，请稍后再试。'
            : '解锁失败，请检查口令后重试。';
        } catch {
          error.textContent = '暂时无法解锁，请稍后再试。';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
