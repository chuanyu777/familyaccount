# 一键启动 MySQL 8 + 后端应用。前端仍用本地 vite dev（http://localhost:5173）。
# 用法：docker compose up --build
services:
  mysql:
    image: mysql:8.0
    container_name: family-ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: family_ledger
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: family-ledger-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: family_ledger
      DB_USER: root
      DB_PASSWORD: root123456
      SESSION_SECRET: local-development-session-secret
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:-}
      SPECIAL_LEDGER_NAME: 本地测试特殊账本
      PLATFORM_ADMIN_USERNAME: platform-admin
      PLATFORM_ADMIN_PASSWORD: platform-admin-password
      SPECIAL_LEDGER_OWNER_USERNAME: ledger-owner
      SPECIAL_LEDGER_OWNER_PASSWORD: ledger-owner-password
      SPECIAL_LEDGER_MEMBER_USERNAME: ledger-member
      SPECIAL_LEDGER_MEMBER_PASSWORD: ledger-member-password
    ports:
      - "3001:3001"

volumes:
  mysql-data:
