server:
  port: 3001

spring:
  application:
    name: family-ledger
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:family_ledger}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

familyledger:
  auth:
    session-secret: ${SESSION_SECRET:}
    session-ttl-seconds: ${SESSION_TTL_SECONDS:2592000}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  wechat:
    app-id: ${WECHAT_MINI_APP_ID:}
    app-secret: ${WECHAT_MINI_APP_SECRET:}
    base-url: ${WECHAT_API_BASE_URL:https://api.weixin.qq.com}
  seed:
    special-ledger-name: ${SPECIAL_LEDGER_NAME:}
    platform-admin:
      username: ${PLATFORM_ADMIN_USERNAME:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
    owner:
      display-name: ${SPECIAL_LEDGER_OWNER_DISPLAY_NAME:本人}
      username: ${SPECIAL_LEDGER_OWNER_USERNAME:}
      password: ${SPECIAL_LEDGER_OWNER_PASSWORD:}
    member:
      display-name: ${SPECIAL_LEDGER_MEMBER_DISPLAY_NAME:配偶}
      username: ${SPECIAL_LEDGER_MEMBER_USERNAME:}
      password: ${SPECIAL_LEDGER_MEMBER_PASSWORD:}
