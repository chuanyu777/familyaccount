spring:
  datasource:
    url: jdbc:h2:mem:family_ledger;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

familyledger:
  auth:
    session-secret: test-session-secret-0123456789abcdef
    session-ttl-seconds: 3600
  wechat:
    app-id: test-app-id
    app-secret: test-app-secret
    base-url: http://localhost
  seed:
    special-ledger-name: 测试特殊账本
    platform-admin:
      username: platform-admin
      password: platform-admin-password
    owner:
      display-name: 本人
      username: ledger-owner
      password: ledger-owner-password
    member:
      display-name: 配偶
      username: ledger-member
      password: ledger-member-password
